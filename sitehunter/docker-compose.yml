# Banco PostgreSQL local para desenvolvimento: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sitehunter
      POSTGRES_PASSWORD: sitehunter
      POSTGRES_DB: sitehunter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: {}
